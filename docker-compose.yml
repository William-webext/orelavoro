# Ore Lavoro – stack per Portainer (Stacks → Add stack → Web editor).
# I valori ${...} si inseriscono nella sezione "Environment variables" di Portainer:
# nel repository non c'è nessun dato personale.
services:
  orelavoro:
    image: ghcr.io/william-webext/orelavoro:latest
    container_name: orelavoro
    restart: unless-stopped
    ports:
      - "3000:3000" # il tunnel Cloudflare punta a http://IP-DEL-NAS:3000
    volumes:
      - ${DATA_PATH:-/volume1/docker/orelavoro/data}:/data
    environment:
      # Utente con cui il container scrive in /data (su Synology: comando "id" via SSH).
      PUID: ${PUID:-1026}
      PGID: ${PGID:-100}
      APP_TZ: ${APP_TZ:-Europe/Lisbon}
      APP_URL: ${APP_URL:-}

      # Superadmin: creato SOLO al primo avvio (database vuoto).
      SUPERADMIN_USER: ${SUPERADMIN_USER:-}
      SUPERADMIN_PIN: ${SUPERADMIN_PIN:-}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Amministratore}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}

      # Mail (SMTP autenticato, facoltativo)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
